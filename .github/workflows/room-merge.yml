name: room-merge
# A control room's own PR merges itself (Lou, 2026-11-19; V-1119-49, earth-616-hq/core-product#1351, decision file
# earth-616-hq/toc-logs#16): the room adds the label `room:merge`, and this merges the PR once the principal
# reviewer's PASS is on its head and CI is green. ROOM PRs ONLY: Alpha and Bravo keep Master Chief and the gates.
#
# It merges only when every one of these holds; otherwise it does nothing and the run log says why:
#   1. the PR is open, not a draft, from a branch in this repo, and carries `room:merge`;
#   2. its body has a `Room: <x>` line (x is a…g, team/config/rooms.json), which makes it a room's PR (src/ledger/rooms.ts roomOf);
#   3. it is not an Alpha or Bravo PR: no `Team:` line, no Bravo label (claimed:/reviewing:/held:bravo, bravo-shift),
#      and no claude/bravo- or bravo/ branch;
#   4. it carries no `merge:happy` label (or the old `merge:hq` or `merge:lou`: the lou level is retired into happy,
#      core-jarvis#1286), it touches no box script (team/addons/discussion/box/: SWAT Command merges those and posts
#      the install paste), and no hand-merge path (HAND_PATHS below: workflows, secrets, approvals, Happy's own files;
#      Lou merges those by hand);
#   5. the principal reviewer's latest verdict is PASS, without `security`, and on the head commit;
#   6. CI on the head is green: at least one check run, every check run done as success, neutral or skipped (this
#      workflow's own and would-auto-merge aside), and no failing or pending commit status;
#   7. the merge order holds (core-jarvis#1274; Lou via the VCC, 2026-11-25): a PR whose body has a `Merge after: #n`
#      line (or `owner/repo#n`; several refs, comma or space separated) isn't merged while a PR it names is still open.
#      JJ writes the line when the VCC gives an order. The same rule as core-jarvis's copy (core-jarvis#1278) and SWAT's
#      check (`jarvis bravo merge-after`, core-jarvis src/runner/mergeAfter.ts).
# It never checks out the PR's code: everything is read through the API, so pull_request_target stays safe.
# Its token is a personal one, not GITHUB_TOKEN: a merge by GITHUB_TOKEN starts no workflow, and main's CI must run.
#
# One file, the same in every repo it covers: earth-616-hq/core-jarvis (this copy is the source), core-product,
# toc-logs, toc-switch-runner, and projectll/j-benchmark-testing-ai-models, debater-ko and danger-room. Copy it
# unchanged; core-jarvis tests/roomMerge.test.ts tests the script below.
on:
  pull_request_target:
    types: [labeled, synchronize, ready_for_review]
  schedule:
    - cron: "7,22,37,52 * * * *"   # a verdict or CI that lands after the label: one sweep of the labelled PRs every 15 minutes
  # No pull_request_review trigger: it would run the PR's own copy of this file, with the token, so a PR could change
  # the rules it is merged by. pull_request_target and schedule run main's copy.
  workflow_dispatch:

concurrency:
  group: room-merge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  merge:
    # the check run's name: SELF below skips it, so a run never waits on itself (an unnamed job's check is `merge`,
    # which read as "CI not green: in_progress - merge" on core-jarvis#940, 2026-11-21; folded in from #961)
    name: room-merge
    if: github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'room:merge'
    runs-on: [self-hosted, fly]   # the earth-616-hq org runner, earth-616-hq/toc-switch-runner
    timeout-minutes: 10
    steps:
      - name: Merge the room PR if every rule holds
        env:
          GH_TOKEN: ${{ secrets.ROOM_MERGE_TOKEN || secrets.LEDGER_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          SELF="room-merge"
          [ -n "${GH_TOKEN:-}" ] || { echo "no ROOM_MERGE_TOKEN or LEDGER_TOKEN secret in $REPO: nothing merged"; exit 0; }
          # which [principal-reviewer] verdicts count (V-1120-01, -48; jarvis-901a): only one from a `verdictAuthors` login, from
          # earth-616-hq/core-jarvis team/config/claude-runner.json on main: louisli, SWAT's seat thelouis7789, and Romeo's bot
          # logins (github-actions[bot], earth-616-agents[bot]), whose PASS counts since V-1120-48; no other author's.
          # Unreadable config: louisli only. The same rule as the TS gates (src/runner/github.ts trustedReviews).
          RCFG=$(gh api "repos/earth-616-hq/core-jarvis/contents/team/config/claude-runner.json?ref=main" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null) || RCFG=""
          AUTHORS=$(jq -c '.verdictAuthors | arrays' <<< "$RCFG" 2>/dev/null) || AUTHORS=""
          [ -n "$AUTHORS" ] || AUTHORS='["louisli"]'
          # Every per-PR read fails soft (core-jarvis#1101): one PR the token can't read prints `#N: not merged: can't read …`
          # and the sweep goes on to the next; the run stays green. A read that fails never counts as a pass (files: not
          # known to be free of box scripts, so not merged).
          ERR=$(mktemp)
          # hand-merge paths (`handMerge` in core-jarvis team/config/approvals.json; core-jarvis#1237, #1286): never merged
          # here, whatever the label. The same list as core-jarvis's copy.
          HAND_PATHS='^(\.github/workflows/|scripts/secret\.mjs$|src/secrets/|docs/secrets\.md$|team/config/\.secrets$|team/config/secrets\.json$|team/config/approvals\.json$|team/core/agents/happy/|team/core/teams/happy/|team/core/skills/happy/)'
          why_err() { head -c 200 "$ERR" | tr '\n' ' ' | sed 's/ *$//'; }
          verdict() {  # PR $1's latest trusted principal verdict: "<commit>\t<line 1>", or none
            gh api "repos/$REPO/pulls/$1/reviews?per_page=100" --paginate | jq -s -r --argjson who "$AUTHORS" '[.[][] | select((.body // "") | startswith("[principal-reviewer]: Reviewer verdict: "))
              | select((.user.login // "") as $u | $who | index([$u]) != null)]
              | last | if . == null then "none" else "\(.commit_id)\t\(.body | split("\n")[0])" end'
          }
          merge_after() {  # PR body $1: empty when every PR its `Merge after:` lines name is closed (or there's none), else why not
            local refs ref r n st
            refs=$(grep -iE '^[[:space:]]*Merge after:' <<< "$1" | sed -E 's/^[[:space:]]*[Mm]erge [Aa]fter://' | grep -oE '([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' | awk '!seen[$0]++') || return 0
            for ref in $refs; do
              r=${ref%#*} n=${ref##*#}; [ -n "$r" ] || r=$REPO
              if ! st=$(gh api "repos/$r/issues/$n" --jq .state 2>"$ERR"); then echo "merge after $ref: can't read it ($(why_err))"; return; fi
              [ "$st" = open ] && { echo "merge after $ref: still open"; return; }
            done
            return 0
          }
          one() {
            local pr=$1 meta head body labels branch draft state same
            meta=$(gh api "repos/$REPO/pulls/$pr" --jq '[.state, (.draft|tostring), .head.sha, .head.ref, (.head.repo.full_name == .base.repo.full_name | tostring), ([.labels[].name] | join(","))] | join("\t")') || { echo "#$pr: unreadable"; return; }
            IFS=$'\t' read -r state draft head branch same labels <<< "$meta"
            body=$(gh api "repos/$REPO/pulls/$pr" --jq '.body // ""' 2>"$ERR") || { echo "#$pr: not merged: can't read the PR body ($(why_err))"; return; }
            local why=""
            [ "$state" = open ] || why="not open"
            [ -z "$why" ] && [ "$draft" = false ] || why=${why:-"a draft"}
            [ -z "$why" ] && [ "$same" = true ] || why=${why:-"from a fork"}
            [ -n "$why" ] || why=$(merge_after "$body")
            [ -z "$why" ] && [[ ",$labels," == *",room:merge,"* ]] || why=${why:-"no room:merge label"}
            [ -z "$why" ] && grep -qiE '^[[:space:]]*Room:[[:space:]]*[a-g][[:space:]]*$' <<< "$body" || why=${why:-"no Room: line, so not a room PR"}
            [ -z "$why" ] && ! grep -qiE '^[[:space:]]*Team:' <<< "$body" || why=${why:-"a Team: line: an Alpha or Bravo PR, merged through Master Chief and the gates"}
            [ -z "$why" ] && ! [[ ",$labels," =~ ,(claimed:bravo|reviewing:bravo|held:bravo|bravo-shift), ]] || why=${why:-"a Bravo label: merged through Master Chief and the gates"}
            [ -z "$why" ] && ! [[ "$branch" =~ ^(claude/bravo-|bravo/) ]] || why=${why:-"a Bravo branch: merged through Master Chief and the gates"}
            [ -z "$why" ] && ! [[ ",$labels," =~ ,(merge:hq|merge:lou|merge:happy), ]] || why=${why:-"merge level happy (or the old hq or lou): not a plain room merge"}
            if [ -z "$why" ]; then
              local files
              if ! files=$(gh api "repos/$REPO/pulls/$pr/files?per_page=100" --paginate --jq '.[].filename' 2>"$ERR"); then why="can't read its files ($(why_err))"
              elif grep -q '^team/addons/discussion/box/' <<< "$files"; then why="a box script: SWAT Command merges it and posts the install paste"
              elif grep -qE "$HAND_PATHS" <<< "$files"; then why="a hand-merge path ($(grep -E "$HAND_PATHS" <<< "$files" | head -2 | tr '\n' ' ')): Lou merges it"
              fi
            fi
            if [ -z "$why" ]; then
              local v
              if ! v=$(verdict "$pr" 2>"$ERR"); then why="can't read its reviews ($(why_err))"
              elif [ "$v" = none ] || [ -z "$v" ]; then why="no principal-reviewer verdict"
              elif [ "${v%%$'\t'*}" != "$head" ]; then why="the principal reviewer's latest verdict isn't on the head"
              elif ! grep -qE '^\[principal-reviewer\]: Reviewer verdict: PASS\b' <<< "${v#*$'\t'}"; then why="the principal reviewer's verdict isn't PASS"
              elif grep -qi 'security' <<< "${v#*$'\t'}"; then why="a security PASS: Lou merges it"
              fi
            fi
            if [ -z "$why" ]; then
              local runs st
              if ! runs=$(gh api "repos/$REPO/commits/$head/check-runs?per_page=100" --paginate --jq ".check_runs[] | select(.name != \"$SELF\" and .name != \"would-auto-merge\" and .name != \"romeo\") | \"\(.status) \(.conclusion // \"-\") \(.name)\"" 2>"$ERR"); then why="can't read CI ($(why_err))"
              elif ! st=$(gh api "repos/$REPO/commits/$head/status" --jq '.statuses | map(.state) | join(",")' 2>"$ERR"); then why="can't read CI's commit statuses ($(why_err))"
              elif [ -z "$runs" ]; then why="no CI on the head yet"
              elif grep -qvE '^completed (success|neutral|skipped) ' <<< "$runs"; then why="CI not green: $(grep -vE '^completed (success|neutral|skipped) ' <<< "$runs" | head -3 | tr '\n' ';')"
              elif [[ ",$st," =~ ,(failure|error|pending), ]]; then why="a commit status is failing or pending"
              fi
            fi
            if [ -n "$why" ]; then echo "#$pr: not merged: $why"; return; fi
            if gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=merge -f sha="$head" --silent; then
              echo "#$pr: merged at ${head:0:7}"
              gh api "repos/$REPO/issues/$pr/comments" -f body="Merged by: room-merge · $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET · room PR, principal-reviewer PASS on ${head:0:7}, CI green (V-1119-49)" --silent || true
            else
              echo "#$pr: merge refused by GitHub (conflict, or the head moved)"
            fi
          }
          if [ -n "${PR:-}" ]; then
            one "$PR"
          else
            prs=$(gh api "repos/$REPO/issues?state=open&labels=room:merge&per_page=100" --paginate --jq '.[] | select(.pull_request) | .number' 2>"$ERR") || { echo "can't list the room:merge PRs ($(why_err)): nothing merged"; exit 0; }
            for pr in $prs; do one "$pr"; done
          fi
